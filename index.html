<title>Ahmed &amp; Awad Barber Shop</title>
<style>
  :root{
    --gold:#C58636;
    --gold-light:#E3AE66;
    --gold-deep:#8B5A20;
    --cream:#FFFCE9;
    --ink:#070503;
    --ink-2:#150F08;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    touch-action:manipulation;
  }

  /* ---------- Loading splash ---------- */
  .splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
      radial-gradient(480px 420px at 50% 38%, rgba(197,134,54,.18), rgba(197,134,54,0) 62%),
      var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    transition:opacity .55s ease, transform .6s ease;
  }
  .splash.hide{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }
  .splash-mark{
    width:86px;
    height:86px;
    opacity:0;
    animation:markIn .7s ease forwards .1s;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
  }
  .splash-mark img{width:100%;height:100%;display:block;}
  @keyframes markIn{
    from{opacity:0; transform:translateY(6px) scale(.92);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .cut-wrap{
    position:relative;
    width:220px;
    height:26px;
  }
  .track{
    position:absolute;
    left:0;right:0;top:50%;
    height:1.5px;
    transform:translateY(-50%);
    background:rgba(197,134,54,.28);
  }
  .fill{
    position:absolute;
    left:0;top:50%;
    height:1.5px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, var(--gold-deep), var(--gold-light));
    width:0%;
  }
  .scissor{
    position:absolute;
    top:50%;
    left:0%;
    width:30px;
    height:26px;
    transform:translate(-6px,-50%);
    filter:drop-shadow(0 0 4px rgba(197,134,54,.55));
  }
  .scissor svg{width:100%;height:100%;display:block;}
  .blade-top{transform-origin:24px 12px;animation:snipTop .5s ease-in-out infinite;}
  .blade-bottom{transform-origin:24px 12px;animation:snipBottom .5s ease-in-out infinite;}
  @keyframes snipTop{0%,100%{transform:rotate(0deg);}50%{transform:rotate(11deg);}}
  @keyframes snipBottom{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-11deg);}}
  @media (prefers-reduced-motion:reduce){
    .splash{display:none;}
  }

  /* ---------- Main page ---------- */
  .stage{
    position:fixed;
    inset:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(560px 420px at 50% 6%, rgba(197,134,54,.13), rgba(197,134,54,0) 60%),
      radial-gradient(900px 700px at 50% 108%, rgba(197,134,54,.08), rgba(197,134,54,0) 55%),
      var(--ink);
  }

  .brand{
    position:absolute;
    left:0;right:0;
    top:calc(env(safe-area-inset-top, 0px) + 9vh);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    translate:0 -12px;
    transition:opacity .6s ease, translate .6s cubic-bezier(.19,1,.22,1);
  }
  .brand.show{opacity:1;translate:0 0;}
  .logo-card{
    width:158px;
    height:158px;
    border-radius:36px;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    box-shadow:
      0 20px 40px rgba(0,0,0,.55),
      0 0 0 3px rgba(197,134,54,.85),
      0 0 34px rgba(197,134,54,.25);
  }
  .logo-card img{width:100%;height:100%;object-fit:contain;display:block;}

  .actions{
    position:absolute;
    left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
  }
  .btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:340px;
    height:74px;
    padding:7px 24px 7px 7px;
    border-radius:999px;
    background:linear-gradient(155deg,#1c150c,#0b0805);
    box-shadow:
      0 14px 30px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(197,134,54,.22);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .5s ease, translate .5s cubic-bezier(.19,1,.22,1), box-shadow .2s ease;
    opacity:0;
    translate:0 14px;
  }
  .actions.show .btn{opacity:1;translate:0 0;}
  .actions.show .btn:nth-of-type(1){transition-delay:.05s;}
  .actions.show .btn:nth-of-type(2){transition-delay:.16s;}
  .actions.show .btn:nth-of-type(3){transition-delay:.27s;}
  .actions.show .btn:nth-of-type(4){transition-delay:.38s;}
  .btn:active{
    transform:scale(.965);
    box-shadow:
      0 10px 22px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(197,134,54,.55);
  }
  .badge{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    overflow:hidden;
    padding:5px;
    box-shadow:0 0 0 2px rgba(197,134,54,.55);
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .brand-badge{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    line-height:1;
  }
  .g-blue{color:#4285F4;}
  .g-red{color:#EA4335;}
  .g-yellow{color:#FBBC05;}
  .g-green{color:#34A853;}
  .google-word{font-size:16px;font-weight:700;white-space:nowrap;}
  .stars{font-size:10px;letter-spacing:1.5px;color:#F5A623;}
  .tiktok-mark{position:relative;display:inline-block;width:26px;height:30px;}
  .tt-layer{position:absolute;top:0;left:0;font-size:30px;line-height:30px;}
  .tt-cyan{color:#25F4EE;transform:translate(-1.6px,0);}
  .tt-pink{color:#FE2C55;transform:translate(1.6px,0);}
  .tt-black{color:#0a0a0a;}
  .social-word{font-size:11px;font-weight:800;letter-spacing:.2px;color:#111;margin-top:1px;white-space:nowrap;}
  .label{
    flex:1;
    text-align:center;
    color:var(--cream);
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    white-space:nowrap;
  }
</style>
</head>

<script>
  (function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var splash = document.getElementById('splash');
    var actions = document.getElementById('actions');
    var brand = document.getElementById('brand');

    if (reduce){
      splash.style.display='none';
      actions.classList.add('show');
      brand.classList.add('show');
      return;
    }

    var fill = document.getElementById('fill');
    var scissor = document.getElementById('scissor');
    var duration = 1500;
    var start = null;

    function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

    function frame(ts){
      if(!start) start = ts;
      var t = Math.min((ts-start)/duration, 1);
      var e = ease(t);
      fill.style.width = (e*100)+'%';
      scissor.style.left = 'calc(' + (e*100) + '% - 6px)';
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        setTimeout(function(){
          splash.classList.add('hide');
          actions.classList.add('show');
          brand.classList.add('show');
          setTimeout(function(){ splash.style.display='none'; }, 650);
        }, 280);
      }
    }
    requestAnimationFrame(frame);
  })();
